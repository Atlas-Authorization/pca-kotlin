          test -s test-data/ref-attest-vendors.json.gz
          mvn -B -ntp -q surefire:test -Dtest='RefAttestVendorsDiffTest'
      - name: Blue control protocol (example agent and reviews, example blue, the decision procedure over every configuration, red policy and hostile action, the example evaluation); the shared oracle, every case; a missing file fails
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-control-blue.json.gz
          mvn -B -ntp -q surefire:test -Dtest='RefControlBlueDiffTest'
      - name: Intent leftovers (strict-artifact helpers, ask-the-principal question, classifier, accumulator receipts, session-store admission); the shared oracle, every case; a missing file fails
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-intent-misc2.json.gz
          mvn -B -ntp -q surefire:test -Dtest='RefIntentMisc2DiffTest'
      - name: Canonical number/string forms (ES Number::toString, lone surrogates) and EC curves beyond SunEC (BouncyCastle)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='CanonicalVectorsTest,EcCurveTest'
      - name: Model rules (rules 20-21 end to end through authorize, signed grants)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='ModelRulesTest'
      - name: Objective-risk binding (nothing committed, malformed commitment, instance config, heuristic fallback opt-in)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='ObjectiveBindingTest'
      - name: Hardware-attestation vendor names (constants, constructors, DCAP quote and TD report parsers, P-256 key wrapper, JWT parsers, JWKS fetchers over an injected transport)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='AttestVendorsTest'
      - name: Experimental lattice-threshold toy (opt-in gate, additive sharing, design as data) and the named connector manifests
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='LatticeThresholdExperimentalTest,ProvidersNamedTest'
      - name: Signed passport + hardware attestation verifiers (SEV-SNP, TDX/DCAP, MAA, Confidential Space, NVIDIA) and strict X.509
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='PassportConformanceTest,AttestationVectorsTest,AttestationFailClosedTest'
      - name: Track 3 vectors (intent-state, ledger, optimistic, mesh)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='IntentStateVectorsTest,ExtensionVectorsTest,MeshVectorsTest'
      - name: Goal vectors
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='GoalVectorsTest'
      - name: Goal binding v3 (approved_goal, goal-commit vectors)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='GoalCommitV3Test'
      - name: Revocation staleness (T9 vectors, per-class windows, signed epoch, authorize freshness check)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='RevocationStalenessTest'
      - name: Operation records (T3 vectors, run-once concurrency on memory and SQLite, recovery, executor)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='OperationsTest'
      - name: Plan lifecycle (T10 vectors in memory and on SQLite, TS root, single-winner transitions, authorize plans)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='PlanLifecycleTest'
      - name: Assurance labels (T8/B7 vectors, requireAssurance gate before the replay claim)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='AssuranceVectorsTest'
      # Provenance by default (check provenance_flow, always on in authorize) and undo windows (the pure layer + the authorize
      # admission hook): the reference's arg-provenance and undo vectors, every section; a missing file FAILS, never skips
      - name: Provenance by default and undo windows (arg-provenance + undo vectors, authorize wiring)
        working-directory: ${{ env.PCA_MONO_SDK }}
        shell: bash
        run: |
          test -s ../../packages/pca/conformance/arg-provenance-vectors.json || { echo "::error::arg-provenance-vectors.json is missing"; exit 1; }
          test -s ../../packages/pca/conformance/undo-vectors.json || { echo "::error::undo-vectors.json is missing"; exit 1; }
          mvn -B -ntp surefire:test -Dtest='ArgProvenanceVectorsTest,UndoVectorsTest,ProvenanceAuthorizeTest,UndoAuthorizeTest,KillArgProvenanceTest,KillUndoTest'
      - name: Store conformance helper (passes the shipped stores, fails racy / aliasing / non-atomic / loose-CAS ones)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='StoreConformanceTest'
      - name: actions-vectors (action kit, ActionDef parse, canonical digest, trait expansion, rule 22 floor check, pack proof, ActionSchema v2)
        working-directory: ${{ env.PCA_MONO_SDK }}
        shell: bash
        run: |
          test -n "$(ls ../../packages/pca-conformance/vectors/actions/*.json 2>/dev/null)" || { echo "::error::action-kit vectors are missing"; exit 1; }
          mvn -B -ntp surefire:test -Dtest='ActionVectorsTest'

  # The Ktor plugin and the Spring (servlet filter, interceptor, auto-configuration) integrations: separate pure-JVM Gradle modules,
  # so the core library keeps no Ktor / Spring dependency. Each compiles the verifier from the shared source directory.
  integrations:
    name: Ktor + Spring integrations (guard semantics)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # the guard tests use grants and PCActns signed by the reference implementation (authorize + model-rules vectors, keys)
      - name: Full adversarial corpus + parity vectors from the flagship
        run: .github/scripts/fetch-flagship-corpus.sh --layout
      - name: Shared vector files are present
        shell: bash
        run: |
          for f in model-rules-vectors keys k3-vectors fresh-at-vectors pca-grant-vectors blueprint-vectors a2a-vectors k4-vectors workflow-vectors readside-vectors vault-aggregate-vectors authorize-workflow-fixtures lease-vectors obligations-vectors break-glass-vectors missing-context-vectors policy-classes-vectors provenance-vectors sigstore-vectors arg-provenance-vectors undo-vectors; do
            test -s packages/pca/conformance/$f.json || test -s conformance/$f.json || { echo "::error::$f.json is missing"; exit 1; }
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ktor plugin (no config 403 authorize_config, 401/403 split, replay, escalate, signed answer, signature-only opt-in, K5 workflow step)
        run: gradle --no-daemon :pca-ktor:test
      - name: Spring filter, interceptor and auto-configuration (same guard semantics, K5 workflow step)
        run: gradle --no-daemon :pca-spring:test

  # The runnable Ktor server example: its own Gradle build, consuming the library through includeBuild. It carries its own proofs
  # (src/test/resources/proofs.json), so it needs no corpus download.
  example-ktor-server:
    name: examples/ktor-server (protect() smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: gradle test
        working-directory: examples/ktor-server
        run: gradle --no-daemon test
