name: CI

# The Android library (step-up + verifier) builds and runs its JVM unit tests with Gradle (incl. ConformanceTest over the
# shared corpus, conformance/vectors.json); the pure-JVM verifier is also built and tested with Maven.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: gradle ${{ matrix.task }} (Android library)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        task: [assembleRelease, testDebugUnitTest]
    steps:
      - uses: actions/checkout@v4
      # --layout: the 0.5 parity tests (decision / model rules / escalation / passport / attestation / intent-state / ledger /
      # optimistic / mesh / goal vectors) locate the shared corpus under packages/pca/conformance and packages/pca-conformance
      - name: Full adversarial corpus + parity vectors from the flagship
        run: .github/scripts/fetch-flagship-corpus.sh --layout
      - name: libsodium (ristretto255 / Ed25519 backend)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libsodium-dev; elif [ "$RUNNER_OS" = macOS ]; then brew install libsodium; fi
      # CI=true makes the real-host sandbox tests fail when the pinned host is absent: build it from the flagship crate the corpus step fetched
      - name: pca-wasmtime-host (real host for the subprocess sandbox tests)
        if: matrix.task == 'testDebugUnitTest'
        run: .github/scripts/build-wasmtime-host.sh "$RUNNER_TEMP/wasmtime-host" "$RUNNER_TEMP/pca-flagship/packages/pca-sandbox/wasmtime-host"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: gradle ${{ matrix.task }}
        run: gradle --no-daemon ${{ matrix.task }}
        env:
          PCA_REQUIRE_WASMTIME_HOST: ${{ matrix.task == 'testDebugUnitTest' && '1' || '' }}

  jvm-verifier:
    name: verifier on the JVM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # windows recompiles the module in every step; with the base kill suites it passed 30 min (run 41938306458)
    timeout-minutes: 60
    # JDK 23: the verifier's LESS backend uses the FFM API (JDK 22+)
    env:
      JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # SnapshotTest locates the mutation-oracle inputs by the source layout (../../tools/pca-audit from the repo): rebuild it
      - name: Source layout (full shared corpus from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono kotlin-pca $([ "$RUNNER_OS" = Windows ] || echo --less)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RSA DPoP oracle corpus (generated, never committed)
        shell: bash
        run: |
          P="$PCA_MONO_SDK/test-data/ref-dpop-rsa.json.gz"; command -v cygpath >/dev/null && P="$(cygpath -u "$P")"
          .github/scripts/dpop-rsa-corpus.sh "$P"
      - name: Secret-key oracle corpora (generated, never committed)
        shell: bash
        run: |
          D="$PCA_MONO_SDK/test-data"; command -v cygpath >/dev/null && D="$(cygpath -u "$D")"
          .github/scripts/gen-secret-corpus.sh "$D" oprf:oprf core-frost-java:core-frost-java mpc-ot:mpc-ot attest-eat:attest-eat frost-dkg:frost-dkg
      - uses: actions/setup-java@v4
        id: jdk
        continue-on-error: true  # a transient download failure must not leave the later steps on the runner's default JDK
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - name: JDK 23 again from another vendor when the first setup failed
        if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '23'
          cache: maven
      - name: The job runs on JDK 23 (the Kotlin compiler of the pom rejects the runner's default JDK 25 version string)
        shell: bash
        run: |
          java -version 2>&1
          java -version 2>&1 | grep -q 'version "23' || { echo "::error::JDK 23 is not the active JDK"; exit 1; }
      - name: Build + verifier tests + conformance corpus
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp test
      - name: Agent-side signing (producer vectors byte for byte, TS PCActns verified, native round trips; a missing file fails)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s ../../packages/pca/conformance/producer-vectors.json
          mvn -B -ntp -q surefire:test -Dtest='ProducerVectorsTest,ProducerTest'
          test -s "$PCA_PRODUCER_OUT"
        env:
          PCA_PRODUCER_OUT: ${{ runner.temp }}/producer-native-kotlin.json
      # the post-quantum PCActns this SDK produced (randomised signatures): the reference implementation verifies them
      # (packages/pca/conformance/producer-native/, producer-native.test.ts)
      - name: Upload the post-quantum PCActns for the reference
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: producer-native-kotlin
          path: ${{ runner.temp }}/producer-native-kotlin.json
          if-no-files-found: error
      # Native parity with the TypeScript reference (0.5). Every vector file must be present (a missing file FAILS, never skips); each
      # step runs its tests on their own so a regression is visible as its own step. Already part of the step above.
      - name: Parity vector files are present
        working-directory: ${{ env.PCA_MONO_SDK }}
        shell: bash
        run: |
          for f in decision-vectors model-rules-vectors passport-vectors attestation-evidence-vectors intent-state-vectors ledger-vectors optimistic-vectors mesh-vectors canonical-number-vectors goal-commit-vectors staleness-vectors operation-vectors plan-vectors assurance-vectors caveat-lang-vectors forbid-certificate-vectors policy-link-vectors k3-vectors fresh-at-vectors pca-grant-vectors blueprint-vectors a2a-vectors k4-vectors workflow-vectors readside-vectors vault-aggregate-vectors authorize-workflow-fixtures lease-vectors obligations-vectors break-glass-vectors missing-context-vectors policy-classes-vectors provenance-vectors sigstore-vectors arg-provenance-vectors undo-vectors; do
            test -s ../../packages/pca/conformance/$f.json || { echo "::error::packages/pca/conformance/$f.json is missing"; exit 1; }
          done
          test -s ../../packages/pca-conformance/vectors/goal/index.json || { echo "::error::goal vectors are missing"; exit 1; }
      - name: Decision lattice, rules 20-21, signed escalation answers (every suite), authorize decision + escalation
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='DecisionVectorsTest,EscalationGuardTest'
      # Caveat language v2 (needs_discharge, sealed, narrow, max_uses, derive, spiffe_bound): the TypeScript reference's
      # caveat-lang-vectors.json (all six primitives, reasons included) and the authorize wiring; a missing file FAILS, never skips
      - name: Caveat language v2 vectors and authorize wiring
        working-directory: ${{ env.PCA_MONO_SDK }}
        shell: bash
        run: |
          test -s ../../packages/pca/conformance/caveat-lang-vectors.json || { echo "::error::caveat-lang-vectors.json is missing"; exit 1; }
          mvn -B -ntp surefire:test -Dtest='CaveatLangVectorsTest,CaveatLangAuthorizeTest'
      # K5: workflow admission inside authorize (C-308) and the tokenisation vault + aggregate reads (C-315..C-319); a missing file FAILS, never skips
      - name: K5 authorize workflow fixtures and vault / aggregate vectors
        working-directory: ${{ env.PCA_MONO_SDK }}
        shell: bash
        run: |
          for f in authorize-workflow-fixtures vault-aggregate-vectors; do
            test -s ../../packages/pca/conformance/$f.json || { echo "::error::$f.json is missing"; exit 1; }
          done
          mvn -B -ntp surefire:test -Dtest='K5AuthorizeWorkflowTest,K5VaultAggregateTest'
      - name: Forbid-wins certificate and linked policy template vectors
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp surefire:test -Dtest='PolicyAuthoringVectorsTest'
      - name: Agent-native primitives (caution, rationale binding, tool-schema firewall, envelope introspection, authority leases) and the core verify entry (hooks, gates, assurance), the shared oracles, every case
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -s test-data/ref-agent-native.json.gz
          test -s test-data/ref-core-verify-java.json.gz
          mvn -B -ntp surefire:test -Dtest='AgentNativeDiffTest,CoreVerifyDiffTest'
      - name: Hybrid KEM (X25519 + ML-KEM-768/1024, X-Wing draft-09, FIPS 203 key checks) and QRNG entropy (health tests, HKDF mixing, secureSeed, injected-transport HTTP source; the shared oracles, every case, a missing file fails)
