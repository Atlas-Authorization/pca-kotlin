name: CI

# The Android library (step-up + verifier) builds and runs its JVM unit tests with Gradle (incl. ConformanceTest over the
# shared corpus, conformance/vectors.json); the pure-JVM verifier is also built and tested with Maven.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: gradle ${{ matrix.task }} (Android library)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        task: [assembleRelease, testDebugUnitTest]
    steps:
      - uses: actions/checkout@v4
      # --layout: the 0.5 parity tests (decision / model rules / escalation / passport / attestation / intent-state / ledger /
      # optimistic / mesh / goal vectors) locate the shared corpus under packages/pca/conformance and packages/pca-conformance
      - name: Full adversarial corpus + parity vectors from the flagship
        run: .github/scripts/fetch-flagship-corpus.sh --layout
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: gradle ${{ matrix.task }}
        run: gradle --no-daemon ${{ matrix.task }}

  jvm-verifier:
    name: verifier on the JVM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # JDK 23: the verifier's LESS backend uses the FFM API (JDK 22+)
    env:
      JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # SnapshotTest locates the mutation-oracle inputs by the source layout (../../tools/pca-audit from the repo): rebuild it
      - name: Source layout (full shared corpus from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono kotlin-pca $([ "$RUNNER_OS" = Windows ] || echo --less)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - name: Build + verifier tests + conformance corpus
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp test
      # Native parity with the TypeScript reference (0.5). Every vector file must be present (a missing file FAILS, never skips); each
      # step runs its tests on their own so a regression is visible as its own step. Already part of the step above.
      - name: Parity vector files are present
        working-directory: ${{ env.PCA_MONO_SDK }}
        shell: bash
        run: |
          for f in decision-vectors model-rules-vectors passport-vectors attestation-evidence-vectors intent-state-vectors ledger-vectors optimistic-vectors mesh-vectors canonical-number-vectors; do
            test -s ../../packages/pca/conformance/$f.json || { echo "::error::packages/pca/conformance/$f.json is missing"; exit 1; }
          done
          test -s ../../packages/pca-conformance/vectors/goal/index.json || { echo "::error::goal vectors are missing"; exit 1; }
      - name: Decision lattice, rules 20-21, signed escalation answers (every suite), authorize decision + escalation
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp test -Dtest='DecisionVectorsTest,EscalationGuardTest'
      - name: Canonical number/string forms (ES Number::toString, lone surrogates) and EC curves beyond SunEC (BouncyCastle)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp test -Dtest='CanonicalVectorsTest,EcCurveTest'
      - name: Model rules (rules 20-21 end to end through authorize, signed grants)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp test -Dtest='ModelRulesTest'
      - name: Signed passport + hardware attestation verifiers (SEV-SNP, TDX/DCAP, MAA, Confidential Space, NVIDIA) and strict X.509
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp test -Dtest='PassportConformanceTest,AttestationVectorsTest,AttestationFailClosedTest'
      - name: Track 3 vectors (intent-state, ledger, optimistic, mesh)
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp test -Dtest='IntentStateVectorsTest,ExtensionVectorsTest,MeshVectorsTest'
      - name: Goal vectors
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: mvn -B -ntp test -Dtest='GoalVectorsTest'
