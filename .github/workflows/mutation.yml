name: Mutation

# Mutation testing of the verifier with PIT (pom.xml: ALL mutators, oracle = MutationHarness + the JUnit suites), split
# into shards by target class (the last shard takes every class the others do not, so the shards partition the pom's
# targetClasses exactly). PIT reports are converted with the flagship's tools/pca-audit/native-mutation/pit-convert.mjs and
# the merge job checks the survivors (SURVIVED + NO_COVERAGE) against the equivalent-mutant ledger: it passes when every
# survivor is a ledgered equivalent and no ledger entry is stale. Runs on demand and on ci/** branches (the
# release-candidate check), never on main pushes.
#
# TARGETED mode (the default whenever a baseline exists): every shard uploads its PIT history (pit-history-<k>) and the next
# run feeds it back (historyInputFile), so PIT re-runs ONLY what can have changed: mutants of a class whose bytecode changed
# (any edited line), SURVIVED mutants whose covering tests changed (new kill tests), and NO_COVERAGE mutants (re-analysed
# against fresh coverage). Untouched KILLED / TIMED_OUT / SURVIVED results are carried forward from the history, so each
# shard still reports the COMPLETE mutant set and the merge checks the ledger over the full picture. Baseline = the input
# `baseline_run`, else the newest earlier run of this workflow on the same branch that uploaded the shard's history; none
# (or `full: true`) = a full run, which seeds the history for the next one.
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'run id whose pit-history-<k> artifacts seed a targeted run (default: newest earlier run on this branch)'
        required: false
        default: ''
      full:
        description: 'ignore any baseline history: mutate everything'
        type: boolean
        default: false
      only:
        description: 'Experiment: run only these shards (comma-separated); the merge stays red'
        type: string
        default: ''
      oom_control:
        description: 'Negative control: only Kill06OomControlTest runs, and a mutant it catches dies of a real OutOfMemoryError. The gate must refuse it.'
        type: boolean
        default: false
  push:
    branches: ['ci/**', '!ci/build-**']

permissions:
  contents: read
  actions: read   # download the baseline run's pit-history artifacts

concurrency:
  # a push supersedes an earlier push run; a dispatched (queue) run is never killed by a later push to the branch
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# the old 8-shard plan's "rest" shard hit the job time limit (run 41590828658), so it is split by source file below; ActionVectorsTest replays the shared vectors (flagship layout).
env:
  CRATE: kotlin-pca
  SHARDS: '36'
  P: net.atlasauth.pca.verifier
  # Maven Central answers HTTP 429 when many shards start together: wait and retry instead of losing the shard
  # The shards run Maven OFFLINE (-o) against the repository the `deps` job resolved once, so a shard can never fetch from the network and one
  # transient Maven Central failure cannot sink a shard; a plugin or dependency missing from that cache fails the shard loudly. Maven 3.9 (the
  # runner's) reads MAVEN_ARGS and its resolver honours aether.transport.http.retryHandler.*; the wagon property covers an older Maven.
  # (Gradle never runs here: the Gradle-only modules get a pom generated from their build.gradle.kts and PIT runs through Maven.)
  MAVEN_ARGS: -Daether.transport.http.retryHandler.count=8 -Daether.transport.http.retryHandler.interval=15000 -Dmaven.wagon.http.retryHandler.count=8 -o

jobs:
  reuse:
    name: reuse check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      hash: ${{ steps.reuse.outputs.hash }}
      source: ${{ steps.reuse.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      # input-hash reuse (ci-reuse.mjs): when an earlier run recorded the same input hash, every other job of this run is skipped.
      # continue-on-error: a failing check can only mean "no reuse"; FORCE_FULL / force_full / [force-full] bypass it.
      - id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force_full || inputs.full || vars.FORCE_FULL == '1' || contains(github.event.head_commit.message, '[force-full]') }}
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          PARTIAL: ${{ inputs.only != '' || inputs.oom_control }}
          EXTRA: ''
        run: node .github/scripts/ci-reuse.mjs check --workflow=mutation --self=.github/workflows/mutation.yml --external=flagship --extra="$EXTRA"
  deps:
    name: Maven plugins and dependencies (resolved once)
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_ARGS: -Daether.transport.http.retryHandler.count=8 -Daether.transport.http.retryHandler.interval=15000 -Dmaven.wagon.http.retryHandler.count=8
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: jdk
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '23'
      - name: JDK 23 again from another vendor when the first setup failed
        if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '23'
      - name: The job runs on JDK 23
        shell: bash
        run: |
          java -version 2>&1
          java -version 2>&1 | grep -q 'version "23' || { echo "::error::JDK 23 is not the active JDK"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout
        env:
          LESS: ''
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: The Java core library from the pca-java mirror (the shards of the Java-backed modules build it)
        shell: bash
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY_OWNER:-Atlas-Authorization}/pca-java.git"
          REF="${GITHUB_REF_NAME:-main}"
          git ls-remote --exit-code "$URL" "refs/heads/$REF" "refs/tags/$REF" >/dev/null 2>&1 || REF=main
          git clone -q --depth 1 --branch "$REF" "$URL" "$RUNNER_TEMP/pca-java"
      - name: Cache key (the poms and this workflow)
        id: key
        shell: bash
        run: echo "key=m2-pit-kt-$(find "$MONO/sdks/kotlin-pca" "$RUNNER_TEMP/pca-java" -name pom.xml -not -path '*/target/*' | sort | xargs sha256sum | sha256sum | cut -c1-16)-${{ hashFiles('.github/workflows/mutation.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Resolve every plugin and dependency once (the only job that fetches)
        working-directory: ${{ env.MONO }}/sdks/kotlin-pca
        shell: bash
        run: |
          mvn --version
          # the PIT plugin with its junit5 plugin, every other build plugin, and every project dependency
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:resolve-plugins
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:go-offline
          mvn -B -ntp -q test-compile
          # the Java core library, then the Java adapters the modules depend on (the shards install them the same way)
          mvn -B -ntp -f "$RUNNER_TEMP/pca-java/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:resolve-plugins
          mvn -B -ntp -f "$RUNNER_TEMP/pca-java/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:go-offline
          mvn -B -ntp -q -f "$RUNNER_TEMP/pca-java/pom.xml" install -DskipTests
          for a in pca-fhe-seal pca-mpc-lwe-ot pca-fndsa pca-zk; do
            test -f "$a/adapter/pom.xml" || { echo "::error::$a/adapter is missing: the mirror sync vendors the Java adapter at this ref"; exit 1; }
            mvn -B -ntp -f "$a/adapter/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:go-offline
            mvn -B -ntp -q -f "$a/adapter/pom.xml" install -DskipTests
          done
          # the Gradle-only modules get their pom generated from build.gradle.kts, exactly as in the shards, then every module resolves its own
          for m in pca-ai-core pca-koog pca-langchain4j pca-openai; do
            (cd "$m" && python3 "$GITHUB_WORKSPACE/.github/scripts/gradle-module-pom.py" "$m")
          done
          for m in pca-pairing pca-fhe-seal pca-mpc-lwe-ot pca-fndsa pca-wasm-chicory pca-zk pca-ai-core pca-koog pca-langchain4j pca-openai; do
            (cd "$m" && mvn -B -ntp dependency:resolve-plugins && mvn -B -ntp dependency:go-offline && mvn -B -ntp -q test-compile)
          done
          # the exact PIT invocation a shard runs, once, on one tiny class and test: Maven resolves everything PIT loads (the plugin's own
          # dependencies such as pitest-junit5-plugin, PIT's runtime jars), which resolve-plugins and go-offline do not fetch
          python3 - <<'PY'
          import re
          s = open("pom.xml").read()
          s, a = re.subn(r"<targetClasses>.*?</targetClasses>", "<targetClasses><param>net.atlasauth.pca.verifier.A2a*</param></targetClasses>", s, count=1, flags=re.S)
          s, b = re.subn(r"<targetTests>.*?</targetTests>", "<targetTests><param>net.atlasauth.pca.verifier.A2aVectorsTest</param></targetTests>", s, count=1, flags=re.S)
          assert a == 1 and b == 1, "targetClasses / targetTests not found in pom.xml"
          open("pom.xml", "w").write(s)
          PY
          PIT=(org.pitest:pitest-maven:1.17.1:mutationCoverage -Dthreads=1 -DmutationUnitSize=1 -DtimestampedReports=false -DskipFailingTests=true -DreportsDirectory="$RUNNER_TEMP/pit-deps")
          mvn -B -ntp "${PIT[@]}"
          rm -rf "$RUNNER_TEMP/pit-deps"
          # offline proof: the same invocation with no network; a missing artifact fails this job, not every shard
          mvn -B -ntp -o "${PIT[@]}"
      - name: Save the resolved repository for the shards
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.key.outputs.key }}

  shard:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: [reuse, deps]
    name: shard ${{ matrix.shard }}/36 (${{ matrix.module || matrix.classes }})
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 256 # Enterprise plan: 500 concurrent jobs org-wide; GitHub queues anything above that
      matrix:
        include:
          - { shard: 1, classes: 'Pca' }
          - { shard: 2, classes: 'Pca$*' }
          - { shard: 3, classes: 'Json*,Threshold*' }
          - { shard: 4, classes: 'Pq*,Caveats*,CaveatLang*' }
          - { shard: 5, classes: 'IntentV2*,IntentAcc*' }
          - { shard: 6, classes: 'IntentMap*,IntentSession*,IntentRevocation*,IntentJs*,IntentClassifier*,IntentWB*,IntentArtifacts*' }
          - { shard: 7, classes: 'SafeRegex*,Predicates*' }
          - { shard: 8, classes: 'Authorize*' }
          - { shard: 9, classes: 'Actions*' }
          - { shard: 10, classes: 'Sigstore*,Mesh*' }
          - { shard: 11, classes: 'AttestIntel*,AttestNvidia*' }
          - { shard: 12, classes: 'AttestCert*,AttestDer*,AttestUtil*,AttestXml*' }
          - { shard: 13, classes: 'AttestJws*,AttestMaa*,AttestGcp*,AttestAmd*,Attest,Attest$*' }
          - { shard: 14, classes: 'ActionSchema*,ArgProvenance*,ParamProvenance*,ProvenanceGate*' }
          - { shard: 15, classes: 'OracleFacts*,Operations*,Issue*,Workflow*,Undo*' }
          - { shard: 16, classes: 'Approval*,Assurance*,PlanLifecycle*,PolicyAuthoring*,Revocation*,ReadVault*,ReadSide*' }
          - { shard: 17, classes: 'StoreConformance*,PcaJdbcStateStore*,PcaDecision*,Ledger*,GrantResource*,AtomicKv*,Lease*,Optimistic*,Bundle*' }
          - { shard: 18, classes: 'rest' }
          - { shard: 19, classes: 'surface' }
          - { shard: 20, classes: 'Prohibitions*,Contracts*,ContractEnforcer*,ForbidWins*' }
          # the opt-in modules (each its own pom beside the core, own native library): PIT runs inside the module, mutating its packages
          # against its own tests; the shard reports like any other (file names relative to the SDK root, so the ledger and the source guard apply)
          - { shard: 21, classes: 'module', module: pca-pairing, pkgs: 'pairing,abe,bbs,aggsig' }
          - { shard: 22, classes: 'module', module: pca-fhe-seal, pkgs: 'fhe' }
          - { shard: 23, classes: 'module', module: pca-mpc-lwe-ot, pkgs: 'mpc.lwe' }
          - { shard: 24, classes: 'module', module: pca-fndsa, pkgs: 'fndsa' }
          - { shard: 25, classes: 'module', module: pca-wasm-chicory, pkgs: 'sandbox' }
          # the Gradle-only modules (no pom of their own): the pom is generated from their build.gradle.kts dependencies (gradle-module-pom.py);
          # pca-ai-core's sources are also compiled into the other three, so only its own shard mutates them
          - { shard: 26, classes: 'module', module: pca-ai-core, pkgs: 'ai', gradle: true }
          - { shard: 27, classes: 'module', module: pca-koog, pkgs: 'koog', gradle: true }
          - { shard: 28, classes: 'module', module: pca-langchain4j, pkgs: 'langchain4j', gradle: true }
          - { shard: 29, classes: 'module', module: pca-openai, pkgs: 'openai', gradle: true }
          - { shard: 30, classes: 'module', module: pca-zk, pkgs: 'zk' }
          # a class outside the verifier package (classes 'pkg:<package>.<Class pattern>'): mutated against the tests of its own package
          - { shard: 31, classes: 'pkg:intent.IntentAttest*' }
          # the rest of the intent package, by class name (every class there is Intent<Name>; the source guard below fails on a file no shard mutated)
          - { shard: 32, classes: 'pkg:intent.IntentBond*,intent.IntentClassifierKit*,intent.IntentCompilers*,intent.IntentDerive*,intent.IntentEffects*,intent.IntentFrames*,intent.IntentJit*' }
          - { shard: 33, classes: 'pkg:intent.IntentKit*,intent.IntentLattice*,intent.IntentLayers*,intent.IntentLearner*,intent.IntentMap*' }
          - { shard: 34, classes: 'pkg:intent.IntentMath*,intent.IntentMetrics*,intent.IntentMulti*,intent.IntentObservation*,intent.IntentOmega*,intent.IntentOutcome*' }
          - { shard: 35, classes: 'pkg:intent.IntentPolicy*,intent.IntentProfile*,intent.IntentProvenance*,intent.IntentRamp*,intent.IntentRefine*,intent.IntentRegion*,intent.IntentRender*,intent.IntentRouting*,intent.IntentRuntime*' }
          - { shard: 36, classes: 'pkg:intent.IntentSchema*,intent.IntentSemantic*,intent.IntentStatement*,intent.IntentStats*,intent.IntentTrajectory*,intent.IntentTrustRamp*,intent.IntentUx*,intent.IntentWitnesses*,intent.IntentWorld*' }
    steps:
      - name: Shard filter
        if: ${{ inputs.only != '' }}
        env:
          ONLY: ${{ inputs.only }}
        run: case ",$ONLY," in *,${{ matrix.shard }},*) ;; *) echo "::notice::not in this experiment"; exit 1 ;; esac
      - uses: actions/checkout@v4
      - name: libsodium (ristretto255 / Ed25519 backend)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libsodium-dev; elif [ "$RUNNER_OS" = macOS ]; then brew install libsodium; fi
      - uses: actions/setup-java@v4
        id: jdk
        continue-on-error: true  # a transient download failure must not leave the later steps on the runner's default JDK
        with:
          distribution: temurin
          # 23, not 21: LESS runs through the FFM API (JDK 22+). On 21 LessNative never loaded, so its mutants and every
          # LESS branch of Pq were NO_COVERAGE or survived untested (ci.yml runs the same pom on 23 with --less)
          java-version: '23'
      - name: JDK 23 again from another vendor when the first setup failed
        if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '23'
      - name: The job runs on JDK 23 (the Kotlin compiler of the pom rejects the runner's default JDK 25 version string)
        shell: bash
        run: |
          java -version 2>&1
          java -version 2>&1 | grep -q 'version "23' || { echo "::error::JDK 23 is not the active JDK"; exit 1; }
      - name: Restore the Maven repository resolved by the deps job (offline from here on)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ needs.deps.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout (+ libatlas_less -> ATLAS_PCA_LIBLESS, inherited by the PIT minions)
        env:
          LESS: '1'
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: RSA DPoP oracle corpus (generated, never committed)
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/kotlin-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated, never committed)
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/kotlin-pca/test-data" oprf:oprf core-frost-java:core-frost-java mpc-ot:mpc-ot attest-eat:attest-eat frost-dkg:frost-dkg
      - name: Secret-key oracle corpus (abe)
        if: ${{ matrix.module == 'pca-pairing' }}
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/kotlin-pca/pca-pairing/test-data" abe:abe
      # Native libraries of the opt-in modules: the same steps as the module's own workflow (pairing.yml, fhe.yml, lwe-ot.yml, fndsa.yml).
      # MODULE_JVM_ARGS reaches the PIT minions as extra jvmArgs (PIT ignores the module pom's surefire argLine).
      - name: blst + GT shim (pca-pairing)
        if: ${{ matrix.module == 'pca-pairing' }}
        env:
          BLST_TAG: v0.3.16
          BLST_COMMIT: e7f90de551e8df682f3cc99067d204d8b90d27ad
        run: |
          git clone --quiet --depth 1 --branch "$BLST_TAG" https://github.com/supranational/blst "$RUNNER_TEMP/blst"
          test "$(git -C "$RUNNER_TEMP/blst" rev-parse HEAD)" = "$BLST_COMMIT"
          cd "$MONO/sdks/kotlin-pca/pca-pairing"
          mkdir -p target/native
          cc -O2 -fPIC -shared -D__BLST_PORTABLE__ \
            -I"$RUNNER_TEMP/blst/bindings" -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -o target/native/libpcagt.so \
            src/main/c/pca_gt.c src/main/c/pca_gt_jni.c "$RUNNER_TEMP/blst/src/server.c" "$RUNNER_TEMP/blst/build/assembly.S"
          echo "MODULE_JVM_ARGS=-Dpca.gt.lib=$PWD/target/native/libpcagt.so" >> "$GITHUB_ENV"
      - name: node-seal corpus + libsealc + Java adapter (pca-fhe-seal)
        if: ${{ matrix.module == 'pca-fhe-seal' }}
        env:
          SEAL_TAG: v4.1.2
        run: |
          .github/scripts/fhe-seal-corpus.sh "$RUNNER_TEMP/fhe-seal.json.gz" "$MONO/tools/pca-audit/oracles/fhe-seal.mts"
          lib="$(.github/scripts/build-libsealc.sh "$SEAL_TAG" "$RUNNER_TEMP/seal")/libsealc.so"
          cd "$MONO/sdks/kotlin-pca"
          test -f pca-fhe-seal/adapter/pom.xml || { echo "::error::pca-fhe-seal/adapter is missing: the mirror sync vendors the Java adapter at this ref"; exit 1; }
          mvn -B -ntp -f pca-fhe-seal/adapter/pom.xml install -DskipTests
          echo "MODULE_JVM_ARGS=-Dpca.sealc.lib=$lib -Dpca.fhe.corpus=$RUNNER_TEMP/fhe-seal.json.gz -Dpca.fhe.required=true" >> "$GITHUB_ENV"
      - name: Java core library from the pca-java mirror (pca-mpc-lwe-ot, pca-fndsa, pca-zk)
        if: ${{ matrix.module == 'pca-mpc-lwe-ot' || matrix.module == 'pca-fndsa' || matrix.module == 'pca-zk' }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY_OWNER:-Atlas-Authorization}/pca-java.git"
          REF="${GITHUB_REF_NAME:-main}"
          git ls-remote --exit-code "$URL" "refs/heads/$REF" "refs/tags/$REF" >/dev/null 2>&1 || REF=main
          git clone -q --depth 1 --branch "$REF" "$URL" "$RUNNER_TEMP/pca-java"
          mvn -B -ntp -q -f "$RUNNER_TEMP/pca-java/pom.xml" install -DskipTests
      - name: liblweot + Java adapter (pca-mpc-lwe-ot)
        if: ${{ matrix.module == 'pca-mpc-lwe-ot' }}
        run: |
          lib="$(.github/scripts/build-liblweot.sh "$RUNNER_TEMP/lweot" "$MONO/packages/pca-mpc-lwe-ot-wasm/crate" | tail -1)/liblweot.so"
          cd "$MONO/sdks/kotlin-pca"
          test -f pca-mpc-lwe-ot/adapter/pom.xml || { echo "::error::pca-mpc-lwe-ot/adapter is missing: the mirror sync vendors the Java adapter at this ref"; exit 1; }
          mvn -B -ntp -f pca-mpc-lwe-ot/adapter/pom.xml install -DskipTests
          echo "MODULE_JVM_ARGS=-Dpca.lweot.lib=$lib -Dpca.lweot.required=true" >> "$GITHUB_ENV"
      - name: libfndsa + Java adapter (pca-fndsa)
        if: ${{ matrix.module == 'pca-fndsa' }}
        run: |
          lib="$(.github/scripts/build-libfndsa.sh "$RUNNER_TEMP/fndsa" "$MONO/packages/pca-fndsa-wasm/crate" | tail -1)/libfndsa.so"
          cd "$MONO/sdks/kotlin-pca"
          test -f pca-fndsa/adapter/pom.xml || { echo "::error::pca-fndsa/adapter is missing: the mirror sync vendors the Java adapter at this ref"; exit 1; }
          mvn -B -ntp -f pca-fndsa/adapter/pom.xml install -DskipTests
          echo "ATLAS_PCA_LIBFNDSA=$lib" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBFNDSA_REQUIRED=1" >> "$GITHUB_ENV"
      - name: libpcazk + Java adapter (pca-zk)
        if: ${{ matrix.module == 'pca-zk' }}
        run: |
          lib="$(.github/scripts/build-libpcazk.sh "$RUNNER_TEMP/pcazk" "$MONO/packages/pca-zk/crate" | tail -1)/libpcazk.so"
          cd "$MONO/sdks/kotlin-pca"
          test -f pca-zk/adapter/pom.xml || { echo "::error::pca-zk/adapter is missing: the mirror sync vendors the Java adapter at this ref"; exit 1; }
          mvn -B -ntp -f pca-zk/adapter/pom.xml install -DskipTests
          echo "ATLAS_PCA_LIBPCAZK=$lib" >> "$GITHUB_ENV"
          echo "ATLAS_PCA_LIBPCAZK_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Generated pom (Gradle-only module)
        if: ${{ matrix.gradle }}
        working-directory: ${{ env.MONO }}/sdks/kotlin-pca/${{ matrix.module }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/gradle-module-pom.py" "${{ matrix.module }}"
      - name: Baseline PIT history (targeted mode)
        if: ${{ !(inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline_run }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/pit-history-in"
          ids="$BASELINE"
          if [ -z "$ids" ]; then
            ids="$(gh run list -R "$GITHUB_REPOSITORY" --workflow mutation.yml --branch "$GITHUB_REF_NAME" --limit 20 \
                     --json databaseId -q '.[].databaseId' | grep -vx "$GITHUB_RUN_ID" || true)"
          fi
          for id in $ids; do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "pit-history-$SHARD" -D "$RUNNER_TEMP/pit-history-in" 2>/dev/null \
               && [ -s "$RUNNER_TEMP/pit-history-in/pit-history.txt" ]; then
              echo "PIT_HISTORY_IN=$RUNNER_TEMP/pit-history-in/pit-history.txt" >> "$GITHUB_ENV"
              echo "targeted: shard $SHARD seeded from run $id"; exit 0
            fi
          done
          echo "::notice::shard $SHARD: no baseline PIT history found, full run (seeds the history for the next run)"
      # Targeted runs re-decide every mutant no test killed: PIT reuses a TIMED_OUT / RUN_ERROR / MEMORY_ERROR line from the history of an
      # unchanged class, and a SURVIVED one unless a covering test CHANGED (a brand-new kill-test class does not count), so new kill tests would never get to try them. Dropping those lines makes PIT run them again (SURVIVED
      # ones re-run by themselves when a covering test changed; changed classes re-run whole).
      - name: Re-decide timeouts and run errors from the baseline
        if: ${{ env.PIT_HISTORY_IN != '' }}
        run: |
          python3 - "$PIT_HISTORY_IN" "$RUNNER_TEMP/pit-history-in/pit-history-redecide.txt" <<'REDECIDE'
          import base64, binascii, sys
          BAD = (b"TIMED_OUT", b"RUN_ERROR", b"MEMORY_ERROR", b"SURVIVED", b"NO_COVERAGE")
          def undecided(l):
              try: d = base64.b64decode(l.strip(), validate=True)
              except (binascii.Error, ValueError): return False
              return any(b in d for b in BAD)
          lines = open(sys.argv[1]).readlines()
          keep = [l for l in lines if not undecided(l)]
          print(f"baseline history: {len(lines)} lines, {len(lines) - len(keep)} undecided lines (timeout / run error / survived / no coverage) dropped for a fresh decision")
          open(sys.argv[2], "w").writelines(keep)
          REDECIDE
          echo "PIT_HISTORY_IN=$RUNNER_TEMP/pit-history-in/pit-history-redecide.txt" >> "$GITHUB_ENV"
      - name: Mutate
        working-directory: ${{ env.MONO }}/sdks/kotlin-pca/${{ matrix.module }}
        env:
          CLASSES: ${{ matrix.classes }}
          MODULE: ${{ matrix.module }}
          PKGS: ${{ matrix.pkgs }}
          JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
          PCA_OOM_CONTROL: ${{ inputs.oom_control && '1' || '' }}
        run: |
          # the shard's class set replaces the pom's targetClasses (an explicit pom setting wins over -DtargetClasses)
          python3 - <<'PY'
          import os, re
          p, c = os.environ["P"], os.environ["CLASSES"]
          if os.environ.get("MODULE"):
              # an opt-in module has no PIT setup of its own: give it the core's PIT block, aimed at the module's packages and tests, with the
              # module's native-library properties as extra minion jvmArgs
              blk = re.search(r"<plugin><groupId>org\.pitest</groupId>.*?</plugin>", open("../pom.xml").read(), re.S).group(0)
              pk = "".join(f"<param>net.atlasauth.pca.{x}.*</param>" for x in os.environ["PKGS"].split(","))
              for t in ("targetClasses", "targetTests"):
                  blk = re.sub(rf"<{t}>.*?</{t}>", lambda m: f"<{t}>{pk}</{t}>", blk, count=1, flags=re.S)
              extra = "".join(f"<arg>{a}</arg>" for a in os.environ.get("MODULE_JVM_ARGS", "").split())
              blk = blk.replace("</jvmArgs>", extra + "</jvmArgs>", 1)
              s = open("pom.xml").read()
              assert "</plugins>" in s, "no </plugins> in the module pom"
              open("pom.xml", "w").write(s.replace("</plugins>", blk + "</plugins>", 1))
              print(blk)
              raise SystemExit(0)
          shards = ["Pca", "Pca$*", "Json*,Threshold*", "Pq*,Caveats*,CaveatLang*", "IntentV2*,IntentAcc*",
                    "IntentMap*,IntentSession*,IntentRevocation*,IntentJs*,IntentClassifier*,IntentWB*,IntentArtifacts*",
                    "SafeRegex*,Predicates*",
                    "Authorize*",
                    "Actions*",
                    "Sigstore*,Mesh*",
                    "AttestIntel*,AttestNvidia*",
                    "AttestCert*,AttestDer*,AttestUtil*,AttestXml*",
                    "AttestJws*,AttestMaa*,AttestGcp*,AttestAmd*,Attest,Attest$*",
                    "ActionSchema*,ArgProvenance*,ParamProvenance*,ProvenanceGate*",
                    "OracleFacts*,Operations*,Issue*,Workflow*,Undo*",
                    "Approval*,Assurance*,PlanLifecycle*,PolicyAuthoring*,Revocation*,ReadVault*,ReadSide*",
                    "StoreConformance*,PcaJdbcStateStore*,PcaDecision*,Ledger*,GrantResource*,AtomicKv*,Lease*,Optimistic*,Bundle*",
                    "Prohibitions*,Contracts*,ContractEnforcer*,ForbidWins*"]
          surface = "".join(f"<param>net.atlasauth.pca.{d}.*</param>" for d in ("stepup", "guard", "ktor", "spring", "durable"))
          par = lambda xs: "".join(f"<param>{p}.{x}</param>" for x in xs)
          if c == "rest":
              block = f"<targetClasses><param>{p}.*</param></targetClasses><excludedClasses>{par(','.join(shards).split(','))}</excludedClasses>"
          elif c == "surface":
              block = f"<targetClasses>{surface}</targetClasses>"
          elif c.startswith("pkg:"):
              block = "<targetClasses>" + "".join(f"<param>net.atlasauth.pca.{x}</param>" for x in c[4:].split(",")) + "</targetClasses>"
          else:
              block = f"<targetClasses>{par(c.split(','))}</targetClasses>"
          s = open("pom.xml").read()
          s2 = re.sub(r"<targetClasses>.*?</targetClasses>", lambda m: block, s, count=1, flags=re.S)
          assert s2 != s, "targetClasses not found in pom.xml"
          # the verifier shards keep the verifier tests; the surface's own tests decide its mutants
          tests = surface if c == "surface" else f"<param>{p}.*</param>"
          if c.startswith("pkg:"):
              tests = "".join(f"<param>net.atlasauth.pca.{x.rsplit('.', 1)[0]}.*</param>" for x in c[4:].split(","))
          s2, n = re.subn(r"<targetTests>.*?</targetTests>", lambda m: f"<targetTests>{tests}</targetTests>", s2, count=1, flags=re.S)
          assert n == 1, "targetTests not found in pom.xml"
          if os.environ.get("PCA_OOM_CONTROL") == "1":
              s2, n = re.subn(r"<targetTests>.*?</targetTests>", f"<targetTests><param>{p}.Kill06OomControlTest</param></targetTests>", s2, count=1, flags=re.S)
              assert n == 1, "targetTests not found in pom.xml"
          open("pom.xml", "w").write(s2)
          print(block)
          PY
          mvn -B -ntp -q test-compile
          hist=(-DhistoryOutputFile="$RUNNER_TEMP/pit-history-out/pit-history.txt")
          mkdir -p "$RUNNER_TEMP/pit-history-out"
          [ -n "${PIT_HISTORY_IN:-}" ] && hist+=(-DhistoryInputFile="$PIT_HISTORY_IN")
          mvn -B -ntp org.pitest:pitest-maven:mutationCoverage -Dthreads=4 -DmutationUnitSize=1 -DtimestampedReports=false -Dverbose=true "${hist[@]}" 2>&1 | tee "$RUNNER_TEMP/pit.log" | tail -40
          # one minion JVM per mutant (PIT otherwise reuses a JVM across mutants, so a fixture or main-code cache first filled under a mutant
          # outlives it and fails every later mutant's tests): the JVM starts (one 'Heap Max Capacity' line each) are about the mutant count
          echo "minion JVMs started in pass 1: $(grep -ac 'Heap Max Capacity' "$RUNNER_TEMP/pit.log"); $(grep -aoE 'Generated [0-9]+ mutations' "$RUNNER_TEMP/pit.log" | tail -1)"
          # A timeout is decided again at DOUBLE the limit, so only a second timeout counts (BRIEF: timeouts are not kills). The history
          # without its TIMED_OUT lines makes PIT re-run exactly those (PIT reuses a TIMED_OUT from history, and KILLED / SURVIVED of
          # unchanged classes); RUN_ERROR / MEMORY_ERROR re-run too. The second report replaces the first, so its statuses count.
          OOMLOG="$RUNNER_TEMP/pit.log"
          X1="$(find "$MONO/sdks/kotlin-pca/${{ matrix.module }}/target/pit-reports" -name mutations.xml | head -1)"
          if [ -n "$X1" ] && grep -qE "status=.TIMED_OUT." "$X1"; then
            echo "$(grep -cE "status=.TIMED_OUT." "$X1") TIMED_OUT: re-running them at double the limit"
            python3 - "$RUNNER_TEMP/pit-history-out/pit-history.txt" "$RUNNER_TEMP/pit-history-retry.txt" <<'RETRY'
          import base64, binascii, sys
          def timed_out(l):
              try: return b"TIMED_OUT" in base64.b64decode(l.strip(), validate=True)
              except (binascii.Error, ValueError): return False
          lines = open(sys.argv[1]).readlines()
          keep = [l for l in lines if not timed_out(l)]
          print(f"history: {len(lines)} lines, {len(lines) - len(keep)} TIMED_OUT dropped")
          open(sys.argv[2], "w").writelines(keep)
          RETRY
            sed -i -e 's#<timeoutFactor>3.0</timeoutFactor>#<timeoutFactor>6.0</timeoutFactor>#' -e 's#<timeoutConstant>15000</timeoutConstant>#<timeoutConstant>30000</timeoutConstant>#' pom.xml
            grep -q '<timeoutFactor>6.0</timeoutFactor>' pom.xml && grep -q '<timeoutConstant>30000</timeoutConstant>' pom.xml || { echo "::error::could not double the PIT timeout"; exit 1; }
            mvn -B -ntp org.pitest:pitest-maven:mutationCoverage -Dthreads=4 -DmutationUnitSize=1 -DtimestampedReports=false -Dverbose=true \
              -DhistoryInputFile="$RUNNER_TEMP/pit-history-retry.txt" -DhistoryOutputFile="$RUNNER_TEMP/pit-history-out/pit-history.txt" 2>&1 | tee "$RUNNER_TEMP/pit2.log" | tail -40
            X2="$(find "$MONO/sdks/kotlin-pca/${{ matrix.module }}/target/pit-reports" -name mutations.xml | head -1)"
            echo "after the retry: $(grep -cE "status=.TIMED_OUT." "$X2" || true) TIMED_OUT"
            OOMLOG="$RUNNER_TEMP/pit2.log"   # the run-error statuses that count are the second run's
          fi
          # MEMORY_ERROR is PIT's watchdog (90% of a pool) as often as a real exhaustion, and the watchdog fires on mutants that cannot allocate
          # (proven equivalents that run every covering test). A MEMORY_ERROR therefore decides nothing yet: each one is re-run ONCE on its own
          # (threads 1, every other mutant reused from the history) in a fresh minion with a much larger heap, and THAT result counts: killed,
          # survived (the equivalent ledger applies) or still a run error (it then needs its proof). Both results are logged and uploaded.
          XM="$(find "$MONO/sdks/kotlin-pca/${{ matrix.module }}/target/pit-reports" -name mutations.xml | head -1)"
          if [ -n "$XM" ] && grep -qE "status=.MEMORY_ERROR." "$XM"; then
            cp "$XM" "$RUNNER_TEMP/memerr-before.xml"
            echo "$(grep -cE "status=.MEMORY_ERROR." "$XM") MEMORY_ERROR: re-running them alone with a 10 GB heap"
            python3 - "$RUNNER_TEMP/pit-history-out/pit-history.txt" "$RUNNER_TEMP/pit-history-mem.txt" <<'MEMRETRY'
          import base64, binascii, sys
          def undecided(l):
              try: d = base64.b64decode(l.strip(), validate=True)
              except (binascii.Error, ValueError): return False
              return b"MEMORY_ERROR" in d or b"RUN_ERROR" in d
          lines = open(sys.argv[1]).readlines()
          keep = [l for l in lines if not undecided(l)]
          print(f"history: {len(lines)} lines, {len(lines) - len(keep)} MEMORY_ERROR / RUN_ERROR dropped")
          open(sys.argv[2], "w").writelines(keep)
          MEMRETRY
            sed -i -e 's#<timeoutFactor>3.0</timeoutFactor>#<timeoutFactor>6.0</timeoutFactor>#' -e 's#<timeoutConstant>15000</timeoutConstant>#<timeoutConstant>30000</timeoutConstant>#' -e 's#<arg>-Xmx3000m</arg>#<arg>-Xmx10000m</arg>#' pom.xml
            grep -q '<arg>-Xmx10000m</arg>' pom.xml && grep -q '<timeoutFactor>6.0</timeoutFactor>' pom.xml || { echo "::error::could not set up the MEMORY_ERROR re-run"; exit 1; }
            mvn -B -ntp org.pitest:pitest-maven:mutationCoverage -Dthreads=1 -DmutationUnitSize=1 -DtimestampedReports=false -Dverbose=true \
              -DhistoryInputFile="$RUNNER_TEMP/pit-history-mem.txt" -DhistoryOutputFile="$RUNNER_TEMP/pit-history-out/pit-history.txt" 2>&1 | tee "$RUNNER_TEMP/pit3.log" | tail -40
            XA="$(find "$MONO/sdks/kotlin-pca/${{ matrix.module }}/target/pit-reports" -name mutations.xml | head -1)"
            BEFORE="$RUNNER_TEMP/memerr-before.xml" AFTER="$XA" node -e '
              const fs = require("fs");
              const rows = (f) => { const m = new Map(); for (const x of fs.readFileSync(f, "utf8").matchAll(/<mutation\b([^>]*)>([\s\S]*?)<\/mutation>/g)) { const t = (n) => (new RegExp("<" + n + ">([\\s\\S]*?)</" + n + ">").exec(x[2]) || [, ""])[1]; const st = (/status=.([A-Z_]+)./.exec(x[1]) || [])[1]; m.set([t("mutatedClass"), t("mutatedMethod"), t("index"), t("mutator"), t("lineNumber")].join("|"), { st, desc: t("description") }); } return m; };
              const b = rows(process.env.BEFORE), a = rows(process.env.AFTER); const out = [];
              for (const [k, v] of b) if (v.st === "MEMORY_ERROR") out.push({ mutant: k, desc: v.desc, before: v.st, after: (a.get(k) || {}).st || "missing" });
              fs.writeFileSync(process.env.GITHUB_WORKSPACE + "/memerr-rerun-${{ matrix.shard }}.json", JSON.stringify(out, null, 1));
              for (const r of out) console.log(`MEMORY_ERROR re-run: ${r.mutant} (${r.desc}): ${r.before} -> ${r.after}`);
            '
            OOMLOG="$RUNNER_TEMP/pit3.log"   # the run-error statuses that count are the last run's
          fi
          # PIT's watchdog exits a minion at 90% of ANY pool (heap, code cache, ...) and reports MEMORY_ERROR with no real OutOfMemoryError: name the pools
          grep -oE '[A-Za-z0-9 _'"'"'-]+ has exceeded the shutdown threshold' "$RUNNER_TEMP/pit.log" | sort | uniq -c || true
          # what the heap held just before each firing: garbage drops at the next GC, real retention does not (the GC lines of all minions interleave)
          grep -B40 'has exceeded the shutdown threshold' "$RUNNER_TEMP/pit.log" | grep -E 'Pause (Young|Full|Mixed)|shutdown threshold' | tail -150 | cut -c1-160 || true
          # -XX:+ExitOnOutOfMemoryError ends the minion on a real OutOfMemoryError, so it cannot score as a test's kill: the mutant gets a
          # run-error status. The merge job ties these counts to those mutants, and any other OutOfMemoryError line fails it.
          T="$(grep -c 'Terminating due to java.lang.OutOfMemoryError' "$OOMLOG" || true)"
          # the exception's full name: PIT's verbose log repeats test and flag names
          # both runs: a non-terminating OutOfMemoryError in either could have scored as a kill
          cat "$RUNNER_TEMP"/pit*.log | grep java.lang.OutOfMemoryError | grep -v 'Terminating due to java.lang.OutOfMemoryError' > "$RUNNER_TEMP/oom-other.txt" || true
          head -5 "$RUNNER_TEMP/oom-other.txt" | cut -c1-200
          echo "{\"terminated\":$T,\"other\":$(wc -l < "$RUNNER_TEMP/oom-other.txt")}" | tee "$GITHUB_WORKSPACE/oom-${{ matrix.shard }}.json"
          grep -oE '\(([0-9]+)M\) [0-9.]+ms' "$RUNNER_TEMP/pit.log" | grep -oE '[0-9]+M' | sort -n | tail -1 | sed 's/^/largest GC heap capacity: /' || true
      - name: Report
        env:
          MODULE: ${{ matrix.module }}
          PKGS: ${{ matrix.pkgs }}
        run: |
          X="$(find "$MONO/sdks/kotlin-pca/${{ matrix.module }}/target/pit-reports" -name mutations.xml | head -1)"
          [ -n "$X" ] || { echo "::error::no mutations.xml"; exit 1; }
          node "$MONO/tools/pca-audit/native-mutation/pit-convert.mjs" "$CRATE" "$X" results.json survivors-raw.json killed-raw.json
          # KILLED mutants that have a ledger entry (shared ledger or this repo's part file): lets the merge tell an equivalent that a test
          # killed this run (nondeterministic killer) from a stale entry (stale-killed.mjs); the rest of the killed set stays out of the artifact
          KR=killed-raw.json MONO="$MONO" node -e '
            const fs = require("fs");
            const led = new Set(); const add = (l) => { for (const e of l) if (e.crate === "kotlin-pca") led.add([e.file, e.mutant, e.line.slice(0, 70)].join("\0")); };
            add(JSON.parse(fs.readFileSync(process.env.MONO + "/tools/pca-audit/native-mutation-equivalents.json", "utf8")).equivalents);
            const part = process.env.MONO + "/sdks/kotlin-pca/mutation-equivalents.part.json";
            if (fs.existsSync(part)) add(JSON.parse(fs.readFileSync(part, "utf8")).map((e) => ({ crate: "kotlin-pca", ...e })));
            const k = JSON.parse(fs.readFileSync(process.env.KR, "utf8")).filter((m) => led.has([m.file, m.mutant, m.line.slice(0, 70)].join("\0")));
            fs.writeFileSync("killed-equiv-${{ matrix.shard }}.json", JSON.stringify(k));
          '
          X="$X" node -e '
            const fs = require("fs"); const r = JSON.parse(fs.readFileSync("results.json", "utf8"));
            const counts = {}; for (const m of r) counts[m.st] = (counts[m.st] || 0) + 1;
            const s = JSON.parse(fs.readFileSync("survivors-raw.json", "utf8")).map(({ status, ...x }) => x);
            // for the source guard: package/file of every class this shard mutated
            const files = new Set();
            for (const m of fs.readFileSync(process.env.X, "utf8").matchAll(/<sourceFile>([^<]*)<\/sourceFile>\s*<mutatedClass>([^<]*)<\/mutatedClass>/g)) files.add(m[2].split(".").slice(0, -1).join("/") + "/" + m[1]);
            fs.writeFileSync("mutated-files-${{ matrix.shard }}.json", JSON.stringify([...files]));
            fs.writeFileSync("counts.json", JSON.stringify(counts)); fs.writeFileSync("survivors.json", JSON.stringify(s));
            // PIT counts MEMORY_ERROR / RUN_ERROR / TIMED_OUT as detected though no test decided them: listed here, the merge job fails on
            // every one not in the run-error ledger (mutation-run-errors.json, a per-mutant proof that the mutant caused it)
            const srcOf = (file) => { for (const d of [...(process.env.MODULE ? process.env.PKGS.split(",").map((k) => process.env.MODULE + "/src/main/kotlin/net/atlasauth/pca/" + k.replaceAll(".", "/")) : []), "src/main/kotlin/net/atlasauth/pca/verifier", "src/main/kotlin/net/atlasauth/pca/stepup", "guard-common", "pca-ktor/src/main/kotlin/net/atlasauth/pca/ktor", "pca-spring/src/main/kotlin/net/atlasauth/pca/spring"]) { const p = process.env.MONO + "/sdks/kotlin-pca/" + d + "/" + file; if (fs.existsSync(p)) return fs.readFileSync(p, "utf8").split("\n"); } return []; };
            const errs = r.filter((m) => m.st === "MEMORY_ERROR" || m.st === "RUN_ERROR" || m.st === "TIMED_OUT")
              .map((m) => ({ st: m.st, file: m.file, method: m.method, lineno: m.line, text: (srcOf(m.file)[m.line - 1] ?? "").trim(), mut: m.mut, desc: m.desc }));
            fs.writeFileSync("run-errors-${{ matrix.shard }}.json", JSON.stringify(errs, null, 1));
            // a run-error ledger entry whose mutant a test killed THIS run (a hang mutant can end at a deadline test or at the PIT time limit,
            // depending on timing) is not stale: the merge accepts it when some shard reports that key as KILLED
            const lk = new Set(JSON.parse(fs.readFileSync(process.env.MONO + "/sdks/kotlin-pca/mutation-run-errors.json", "utf8")).map((e) => [e.file, e.method, e.text, e.mut, e.desc].join(" | ")));
            const killedKeys = r.filter((m) => m.st === "KILLED").map((m) => [m.file, m.method, (srcOf(m.file)[m.line - 1] ?? "").trim(), m.mut, m.desc].join(" | ")).filter((k) => lk.has(k));
            fs.writeFileSync("run-error-killed-${{ matrix.shard }}.json", JSON.stringify(killedKeys));
          '
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.shard }} --of="$SHARDS" --tool=pitest \
            --counts=counts.json --survivors=survivors.json --out=shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.json
            run-errors-${{ matrix.shard }}.json
            run-error-killed-${{ matrix.shard }}.json
            killed-equiv-${{ matrix.shard }}.json
            memerr-rerun-${{ matrix.shard }}.json
            mutated-files-${{ matrix.shard }}.json
            oom-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: pit-history-${{ matrix.shard }}
          path: ${{ runner.temp }}/pit-history-out/pit-history.txt
          retention-days: 30
          if-no-files-found: warn

  merge:
    needs: [reuse, shard]
    if: ${{ needs.reuse.outputs.skip != 'true' && (always()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship checker + ledger
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Merge shards and check the ledger
        # a ledgered equivalent that a test KILLED this run is a notice (nondeterministic killer), not a stale entry: stale-killed.mjs
        run: |
          rc=0
          node .github/scripts/mutation-merge.mjs --crate="$CRATE" --shards="$SHARDS" --reports=reports \
            --checker="$MONO/tools/pca-audit" --src="$GITHUB_WORKSPACE" > "$RUNNER_TEMP/merge.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/merge.log"
          node .github/scripts/stale-killed.mjs "$RUNNER_TEMP/merge.log" reports "$rc"
      # gate honesty: a MEMORY_ERROR / RUN_ERROR / TIMED_OUT mutant ended without any test deciding it (PIT still counts it as detected).
      # Timeouts are not kills by themselves (BRIEF, Java's rule): timeoutFactor 3 / 15 s in the pom leaves margin for GC pauses.
      # Each must be in mutation-run-errors.json with a proof that the mutant itself caused it (the unmutated suite passes in
      # the same minion heap: PIT's green-suite coverage run uses the same jvmArgs); an unlisted one or a stale entry fails.
      - name: Run errors and timeouts (MEMORY_ERROR / RUN_ERROR / TIMED_OUT) are each proven mutant-caused
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const got = []; const errs = {}; const oom = {}; const killed = new Set();
            const walk = (d) => { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); if (e.isDirectory()) { walk(p); continue; } let m; if ((m = /^run-errors-(\d+)\.json$/.exec(e.name))) { const l = JSON.parse(fs.readFileSync(p, "utf8")); errs[m[1]] = l.length; got.push(...l); } else if (/^run-error-killed-\d+\.json$/.test(e.name)) { for (const k of JSON.parse(fs.readFileSync(p, "utf8"))) killed.add(k); } else if ((m = /^oom-(\d+)\.json$/.exec(e.name))) oom[m[1]] = JSON.parse(fs.readFileSync(p, "utf8")); } };
            walk("reports");
            const want = Number(process.env.SHARDS), shards = Object.keys(errs).length;
            const led = JSON.parse(fs.readFileSync(process.env.MONO + "/sdks/kotlin-pca/mutation-run-errors.json", "utf8"));
            // no status: a proven-unbounded mutant may end at the watchdog or at a real OutOfMemoryError
            const key = (m) => [m.file, m.method, m.text, m.mut, m.desc].join(" | ");
            const have = new Map(); for (const m of got) have.set(key(m), (have.get(key(m)) || 0) + 1);
            let bad = 0; const used = new Set();
            for (const e of led) {
              if (!e.reason || String(e.reason).length < 40) { console.error("::error::run-error ledger entry without a proof: " + key(e)); bad++; }
              const n = have.get(key(e)) || 0, k = e.multiplicity || 1;
              // a proven-unbounded mutant ends as TIMED_OUT, MEMORY_ERROR or RUN_ERROR, all listed now: any other count is stale or hides one
              if (n === 0 && killed.has(key(e))) console.log(`::notice::run-error ledger entry whose mutant a test killed this run (not stale, not needed): ${key(e)}`);
              else if (n === 0) { console.error(`::error::stale run-error ledger entry (no such mutant this run): ${key(e)}`); bad++; }
              else if (n !== k) { console.error(`::error::run-error ledger entry covers ${k}, the run has ${n}: ${key(e)}`); bad++; }
              used.add(key(e));
            }
            for (const [k, n] of have) if (!used.has(k)) { console.error(`::error::UNPROVEN run error (x${n}), no test decided it: ${k}`); bad++; }
            // a real OutOfMemoryError is a run error, never a kill: each must be one of the run-error mutants of its own shard, which the checks above require a proof for
            for (const k of Object.keys(errs)) {
              const o = oom[k];
              if (!o) { console.error(`::error::shard ${k} reported no OutOfMemoryError count`); bad++; continue; }
              if (o.terminated > errs[k]) { console.error(`::error::shard ${k}: ${o.terminated} OutOfMemoryError exit(s) but ${errs[k]} run-error mutant(s)`); bad++; }
              if (o.other > 0) { console.error(`::error::shard ${k}: ${o.other} OutOfMemoryError line(s) that did not end the minion, so a test may have scored one as a kill`); bad++; }
            }
            if (shards !== want) { console.error(`::error::run-error lists from ${shards}/${want} shards (a missing list is a failure)`); bad++; }
            console.log(`${got.length} MEMORY_ERROR/RUN_ERROR/TIMED_OUT mutant(s) over ${shards} shards, ${led.length} ledger entries, ${bad} problem(s)`);
            process.exit(bad ? 1 : 0);
          '
      - name: Every shipped source file was mutated (recursive)
        if: ${{ !cancelled() }}
        run: |
          G="$MONO/tools/pca-audit/native-mutation/kotlin-source-guard.mjs"
          node "$G" --self-check
          # the Java adapters the mirror vendors into the opt-in modules (pca-*/adapter) are mutated by the Java library's own run, not here
          rm -rf "$MONO"/sdks/kotlin-pca/pca-*/adapter
          node "$G" "$MONO/sdks/kotlin-pca" reports "$SHARDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survivors-merged
          path: reports/survivors-merged.json
          if-no-files-found: ignore

  reuse-record:
    name: reuse record
    needs: [reuse, shard, merge]
    # only a run whose jobs all passed (skipped by their own conditions is fine), that was not partial and not itself a reuse, leaves a record
    if: ${{ !cancelled() && needs.reuse.outputs.skip != 'true' && needs.reuse.outputs.hash != '' && !(inputs.only != '' || inputs.oom_control) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: rec
        env:
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          HASH: ${{ needs.reuse.outputs.hash }}
        run: node .github/scripts/ci-reuse.mjs record --workflow=mutation --hash="$HASH" --out="$RUNNER_TEMP/reuse-record"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rec.outputs.artifact }}
          path: ${{ runner.temp }}/reuse-record/
          retention-days: 21
