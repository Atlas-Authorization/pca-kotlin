name: FHE (BFV on Microsoft SEAL)

# pca-fhe-seal: a Kotlin face on the Java adapter net.atlasauth:pca-fhe-seal (JNA over Microsoft SEAL's C export API, libsealc built here from the
# pinned SEAL tag). The adapter's sources are vendored into this tree (pca-fhe-seal/adapter) by the mirror sync from the monorepo's java-pca at the same ref,
# built here and installed to the local Maven repository. Wire compatibility with the TypeScript reference (node-seal 5.1.7 = SEAL 4.1.2) is shown by replaying a corpus generated here
# by the reference: the native evaluator must reproduce the reference's evaluated ciphertexts byte for byte (re-saved uncompressed).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEAL_TAG: v4.1.2

jobs:
  fhe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Source layout (full shared corpus from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono kotlin-pca
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: node-seal reference corpus
        run: .github/scripts/fhe-seal-corpus.sh "$RUNNER_TEMP/fhe-seal.json.gz"
      - name: libsealc at the pinned SEAL tag
        run: echo "SEALC_LIB=$(.github/scripts/build-libsealc.sh "$SEAL_TAG" "$RUNNER_TEMP/seal")/libsealc.so" >> "$GITHUB_ENV"
      - name: Java core library from the pca-java mirror
        shell: bash
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY_OWNER:-Atlas-Authorization}/pca-java.git"
          REF="${GITHUB_REF_NAME:-main}"
          git ls-remote --exit-code "$URL" "refs/heads/$REF" "refs/tags/$REF" >/dev/null 2>&1 || REF=main
          git clone -q --depth 1 --branch "$REF" "$URL" "$RUNNER_TEMP/pca-java"
          mvn -B -ntp -q -f "$RUNNER_TEMP/pca-java/pom.xml" install -DskipTests
      - name: Java adapter (pca-fhe-seal), vendored into this tree from the monorepo's java-pca at the same ref
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -f pca-fhe-seal/adapter/pom.xml || { echo "::error::pca-fhe-seal/adapter is missing: the mirror sync vendors the Java adapter at this ref"; exit 1; }
          mvn -B -ntp -f pca-fhe-seal/adapter/pom.xml install -DskipTests
      - name: BFV replay and round trip
        working-directory: ${{ env.PCA_MONO_SDK }}/pca-fhe-seal
        run: mvn -B -ntp test -Dpca.sealc.lib="$SEALC_LIB" -Dpca.fhe.corpus="$RUNNER_TEMP/fhe-seal.json.gz" -Dpca.fhe.required=true
