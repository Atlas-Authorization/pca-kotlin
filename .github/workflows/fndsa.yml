name: FN-DSA

# pca-fndsa: the Kotlin face of the Java adapter that runs the real FN-DSA primitive (Pornin's fn-dsa 0.4.0, a draft best guess at FIPS 206) through JNA
# over libfndsa, built here from the flagship's crate. The Kotlin tests replay the keyless known-answer file and the Java framing against the real library.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fndsa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Source layout (full shared corpus and the FN-DSA crate from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono kotlin-pca
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: libfndsa (cargo build --features capi)
        run: echo "ATLAS_PCA_LIBFNDSA=$(.github/scripts/build-libfndsa.sh "$RUNNER_TEMP/fndsa" "$RUNNER_TEMP/mono/packages/pca-fndsa-wasm/crate" | tail -1)/libfndsa.so" >> "$GITHUB_ENV"
      - name: Java core library from the pca-java mirror
        shell: bash
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY_OWNER:-Atlas-Authorization}/pca-java.git"
          REF="${GITHUB_REF_NAME:-main}"
          git ls-remote --exit-code "$URL" "refs/heads/$REF" "refs/tags/$REF" >/dev/null 2>&1 || REF=main
          git clone -q --depth 1 --branch "$REF" "$URL" "$RUNNER_TEMP/pca-java"
          mvn -B -ntp -q -f "$RUNNER_TEMP/pca-java/pom.xml" install -DskipTests
      - name: Java adapter (pca-fndsa), vendored into this tree from the monorepo's java-pca at the same ref
        shell: bash
        working-directory: ${{ env.PCA_MONO_SDK }}
        run: |
          test -f pca-fndsa/adapter/pom.xml || { echo "::error::pca-fndsa/adapter is missing: the mirror sync vendors the Java adapter at this ref"; exit 1; }
          mvn -B -ntp -f pca-fndsa/adapter/pom.xml install -DskipTests
      - name: Known-answer replay over libfndsa
        working-directory: ${{ env.PCA_MONO_SDK }}/pca-fndsa
        env:
          ATLAS_PCA_LIBFNDSA_REQUIRED: '1'
        run: mvn -B -ntp test
